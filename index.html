<style>

.brand{
  display:flex; align-items:center; gap:14px;

  color: var(--vermilion-deep);

}

.stage{
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 640px;
  overflow: hidden;
}

/* 屋檐图片：位于顶部，占画面上部约三分之一 */
.roof{
  position: absolute;
  top: 62px; right: 1.5vw;
  width: min(66vw, 1060px);
  height: auto;
  max-height: 34vh;
  object-fit: contain;
  z-index: 5;
  filter: drop-shadow(0 14px 22px rgba(0,0,0,.16));
  pointer-events: none;
  user-select: none;
}

/* 珠帘 canvas：从屋檐下沿一直垂到视口底部，占画面一半以上 */
#curtain{
  position: absolute;
  left: 0; right: 0;
  top: 320px;
  height: calc(100% - 320px);
  width: 100%;
  z-index: 8;
  touch-action: none;
  cursor: grab;
  display: block;
}
#curtain:active{ cursor: grabbing; }

.title-block{
  position: absolute;
  left: 3.5vw; top: 44%;
  transform: translateY(-50%);
  z-index: 12;
  pointer-events: none;

  gap: 22px;
  align-items: flex-start;
}

  font-weight: 700;
  text-shadow: 0 2px 0 rgba(255,255,255,.35);
}

    诗仙李白最长之作，全诗一百六十六句、八百三十字。写经安史之乱、流放夜郎、承恩赦还，赠韦太守兼怀旧游。此帘以毛笔字为珠，悬于檐下；拂之即摆，拽之即走，松手回弹。

<script>
"use strict";

const POEM = "天上白玉京，十二楼五城。仙人抚我顶，结发受长生。误逐世间乐，颇穷理乱情。九十六圣君，浮云挂空名。天地赌一掷，未能忘战争。试涉霸王略，将期轩冕荣。时命乃大谬，弃之海上行。学剑翻自哂，为文竟何成。剑非万人敌，文窃四海声。儿戏不足道，五噫出西京。临当欲去时，慷慨泪沾缨。叹君倜傥才，标举冠群英。开筵引祖帐，慰此远徂征。鞍马若浮云，送余骠骑亭。歌钟不尽意，白日落昆明。十月到幽州，戈鋋若罗星。君王弃北海，扫地借长鲸。呼吸走百川，燕然可摧倾。心知不得语，却欲栖蓬瀛。弯弧惧天狼，挟矢不敢张。揽涕黄金台，呼天哭昭王。无人贵骏骨，騄耳空腾骧。乐毅倘再生，于今亦奔亡。蹉跎不得意，驱马还贵乡。逢君听弦歌，肃穆坐华堂。百里独太古，陶然卧羲皇。征乐昌乐馆，开筵列壶觞。贤豪间青娥，对烛俨成行。醉舞纷绮席，清歌绕飞梁。欢娱未终朝，秩满归咸阳。祖道拥万人，供帐遥相望。一别隔千里，荣枯异炎凉。炎凉几度改，九土中横溃。汉甲连胡兵，沙尘暗云海。草木摇杀气，星辰无光彩。白骨成丘山，苍生竟何罪。函关壮帝居，国命悬哥舒。长戟三十万，开门纳凶渠。公卿如犬羊，忠谠醢与菹。二圣出游豫，两京遂丘墟。帝子许专征，秉旄控强楚。节制非桓文，军师拥熊虎。人心失去就，贼势腾风雨。惟君固房陵，诚节冠终古。仆卧香炉顶，餐霞漱瑶泉。门开九江转，枕下五湖连。半夜水军来，浔阳满旌旃。空名适自误，迫胁上楼船。徒赐五百金，弃之若浮烟。辞官不受赏，翻谪夜郎天。夜郎万里道，西上令人老。扫荡六合清，仍为负霜草。日月无偏照，何由诉苍昊。良牧称神明，深仁恤交道。一忝青云客，三登黄鹤楼。顾惭祢处士，虚对鹦鹉洲。樊山霸气尽，寥落天地秋。江带峨眉雪，川横三峡流。万舸此中来，连帆过扬州。送此万里目，旷然散我愁。纱窗倚天开，水树绿如发。窥日畏衔山，促酒喜得月。吴娃与越艳，窈窕夸铅红。呼来上云梯，含笑出帘栊。对客小垂手，罗衣舞春风。宾跪请休息，主人情未极。览君荆山作，江鲍堪动色。清水出芙蓉，天然去雕饰。逸兴横素襟，无时不招寻。朱门拥虎士，列戟何森森。剪凿竹石开，萦流涨清深。登台坐水阁，吐论多英音。片辞贵白璧，一诺轻黄金。谓我不愧君，青鸟明丹心。五色云间鹊，飞鸣天上来。传闻赦书至，却放夜郎回。暖气变寒谷，炎烟生死灰。君登凤池去，忽弃贾生才。桀犬尚吠尧，匈奴笑千秋。中夜四五叹，常为大国忧。旌旆夹两山，黄河当中流。连鸡不得进，饮马空夷犹。安得羿善射，一箭落旄头。";

const CHARS = Array.from(POEM.replace(/\s+/g,''));
const TOTAL = CHARS.length;

const canvas = document.getElementById('curtain');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const roofImg = document.getElementById('roof');

/* ---------- 物理状态 ---------- */
let strands = [];       // 每根雨丝是粒子数组
let particles = [];     // 全部粒子
let spacing = 22;       // 相邻字间距
let canvasTop = 0;      // canvas 相对 stage 的 top
let anchorXMin = 0;     // 瓦当行 x 范围（屋檐图在 canvas 内的左右）
let anchorXMax = 0;

/* 鼠标状态 */
let mouseClientX = -9999, mouseClientY = -9999;
let mouseIn = false;
let grabbing = false;
let grabbed = new Map();

/* 物理参数 */
const DAMP = 0.982;
const GRAVITY = 0.05;
const SOLVE_ITER = 4;
const PUSH_R = 150;
const GRAB_R = 120;

/* 变阻器滑块控制（可实时调节波动） */
let windMul = 1.0;     // 风：0 = 静止，1 = 默认，>1 = 强风
let pushMul = 0.16;    // 拂：鼠标推开粒子的位移系数

/* ---------- 诗句切分（以句读为单位，尽量不切断句子） ---------- */
function splitPieces(){
  const pieces = [];
  let buf = '';
  for (let i = 0; i < CHARS.length; i++){
    buf += CHARS[i];
    if (/[。！？；，]/.test(CHARS[i])){ pieces.push(buf); buf = ''; }
  }
  if (buf) pieces.push(buf);
  return pieces;
}

function splitRain(){
  const pieces = splitPieces();
  const COUNT = Math.max(8, Math.min(80, Math.floor((anchorXMax - anchorXMin) / (spacing * 1.02))));
  const avg = TOTAL / COUNT;
  const out = [];
  let cur = '';
  for (let i = 0; i < pieces.length; i++){
    cur += pieces[i];
    const t = avg * (0.6 + Math.random() * 0.8); // 每根长度参差，像自然雨
    if (cur.length >= t && out.length < COUNT - 1 && pieces[i+1]){
      out.push(cur); cur = '';
    }
  }
  if (cur) out.push(cur);
  // 若雨丝数量不足（句子较长），在句子间尽量补分
  if (out.length < COUNT * 0.7){
    return splitRainHard(COUNT);
  }
  return out;
}

// 兜底：直接按字数切分（保证数量）
function splitRainHard(COUNT){
  const lens = [];
  const avg = TOTAL / COUNT;
  for (let i = 0; i < COUNT; i++) lens.push(Math.round(avg * (0.55 + Math.random() * 0.9)));
  let sum = lens.reduce((a,b)=>a+b,0);
  let diff = TOTAL - sum;
  const step = diff > 0 ? 1 : -1;
  let k = 0;
  while(diff !== 0){ lens[k % COUNT] += step; diff -= step; k++; }
  const out = [];
  let idx = 0;
  for (let i = 0; i < COUNT; i++){
    out.push(CHARS.slice(idx, idx + lens[i]).join(''));
    idx += lens[i];
  }
  return out;
}

/* ---------- 布局与粒子构建 ---------- */
function build(){
  const W = canvas.offsetWidth || canvas.width;
  const H = canvas.offsetHeight || canvas.height;

  // 间距 = sqrt(画布宽×高×0.98 ÷ 总字数) × 0.8 —— 密雨感
  const S = Math.max(15, Math.min(36, Math.sqrt((W * H * 0.98) / TOTAL) * 0.8));
  spacing = Math.round(S);

  const texts = splitRain();

  strands = [];
  particles = [];
  const roofW = Math.max(60, anchorXMax - anchorXMin);
  const nRains = texts.length;

  for (let s = 0; s < nRains; s++){
    const chars = Array.from(texts[s]);
    const x = anchorXMin + (s + 0.5) * roofW / nRains; // 瓦当等距
    const strand = [];
    for (let k = 0; k < chars.length; k++){
      const y = 14 + k * spacing;
      const p = { x, y, px: x, py: y, char: chars[k], pinned: k === 0, grabbed: false, windPhase: s * 0.55 };
      particles.push(p);
      strand.push(p);
    }
    strands.push(strand);
  }
}

function resize(){
  const stageRect = stage.getBoundingClientRect();
  const roofRect = roofImg.getBoundingClientRect();
  canvasTop = Math.max(120, roofRect.bottom - stageRect.top + 4);
  canvas.style.top = canvasTop + 'px';
  canvas.style.height = Math.max(200, stageRect.height - canvasTop) + 'px';
  canvas.style.width = stageRect.width + 'px';

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(canvas.offsetWidth * dpr);
  canvas.height = Math.round(canvas.offsetHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 瓦当行：屋檐图底部水平范围
  const canvasRect = canvas.getBoundingClientRect();
  anchorXMin = roofRect.left - canvasRect.left + 8;
  anchorXMax = roofRect.right - canvasRect.left - 8;

  grabbing = false;
  grabbed.clear();
  build();
}

/* ---------- Verlet 物理 ---------- */
function integrate(t){
  const windBase = Math.sin(t * 0.0009) + Math.sin(t * 0.00047 + 1.7) * 0.6;

  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    if (p.pinned || p.grabbed) continue;

    const vx = (p.x - p.px) * DAMP;
    const vy = (p.y - p.py) * DAMP;
    p.px = p.x; p.py = p.y;
    // 雨斜：恒定右向微风 + 各串相位不同的摆动（受 windMul 实时控制）
    p.x += vx + windBase * Math.sin(p.windPhase) * 0.16 * windMul + 0.07 * windMul;
    p.y += vy + GRAVITY;
  }
}

function solve(){
  for (let iter = 0; iter < SOLVE_ITER; iter++){
    for (let s = 0; s < strands.length; s++){
      const strand = strands[s];
      for (let i = 1; i < strand.length; i++){
        const a = strand[i-1];
        const b = strand[i];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let d = Math.sqrt(dx*dx + dy*dy);
        if (d < 1e-6) d = 1e-6;
        const diff = (d - spacing) / d;
        const ox = dx * diff * 0.5;
        const oy = dy * diff * 0.5;
        if (!a.pinned && !a.grabbed){ a.x += ox; a.y += oy; }
        if (!b.pinned && !b.grabbed){ b.x -= ox; b.y -= oy; }
      }
    }
  }
}

/* ---------- 鼠标交互 ---------- */
function localMouse(){
  const r = canvas.getBoundingClientRect();
  return { x: mouseClientX - r.left, y: mouseClientY - r.top };
}

function applyMouse(){
  const m = localMouse();
  mouseIn = (m.x > 0 && m.x < canvas.offsetWidth && m.y > 0 && m.y < canvas.offsetHeight);

  if (!mouseIn) return;

  if (grabbing){
    for (const [p, off] of grabbed){
      p.x = m.x + off.ox * 0.42;
      p.y = m.y + off.oy * 0.42;
    }
    return;
  }

  const R = PUSH_R;
  const R2 = R * R;
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    if (p.pinned) continue;
    const dx = p.x - m.x;
    const dy = p.y - m.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < R2 && d2 > 1e-6){
      const d = Math.sqrt(d2);
      const push = (R - d) / R;
      // pushMul 0~1：0=鼠标无效，1=推开最大 150px
      p.x += (dx / d) * push * R * pushMul;
      p.y += (dy / d) * push * R * pushMul;
    }
  }
}

window.addEventListener('pointermove', e => {
  mouseClientX = e.clientX;
  mouseClientY = e.clientY;
}, {passive:true});

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  mouseClientX = e.clientX;
  mouseClientY = e.clientY;
  grabbing = true;
  grabbed.clear();
  const m = localMouse();
  const R2 = GRAB_R * GRAB_R;
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    if (p.pinned) continue;
    const dx = p.x - m.x;
    const dy = p.y - m.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < R2){
      grabbed.set(p, { ox: dx, oy: dy });
      p.grabbed = true;
    }
  }
});

canvas.addEventListener('pointermove', e => {
  if (grabbing){
    mouseClientX = e.clientX;
    mouseClientY = e.clientY;
  }
});

function releasePointer(){
  grabbing = false;
  for (const p of grabbed.keys()) p.grabbed = false;
  grabbed.clear();
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('pointerleave', e => {
  if (e.buttons === 0 && !grabbing) mouseIn = false;
});

/* ---------- 渲染：瓦当 + 诗雨 ---------- */
function render(){
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.shadowColor = 'rgba(122,31,31,.22)';
  ctx.shadowBlur = 3;
  ctx.shadowOffsetY = 1;

  for (let s = 0; s < strands.length; s++){
    const strand = strands[s];
    const n = strand.length;
    const top = strand[0];

    // 瓦当：金环 + 深红心，挂在屋檐下沿
    ctx.shadowBlur = 4;
    ctx.fillStyle = '#c9a45a';
    ctx.beginPath();
    ctx.arc(top.x, 10, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(122,31,31,.8)';
    ctx.beginPath();
    ctx.arc(top.x, 10, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 3;

    // 诗句雨丝：顶部实、尾部渐隐（如雨滴滑落）
    for (let k = 0; k < n; k++){
      const p = strand[k];
      const a = Math.max(0.16, 1 - (k / n) * 0.84);
      ctx.globalAlpha = a;
      ctx.fillStyle = k === 0 ? '#7a1f1f' : '#a82c2c';
      ctx.fillText(p.char, p.x, p.y);
    }

    // 雨滴：雨丝末端悬着的小水滴
    const b = strand[n-1];
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#c9a45a';
    ctx.beginPath();
    ctx.arc(b.x, b.y + 10, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
}

/* ---------- 主循环 ---------- */
function frame(t){
  integrate(t);
  applyMouse();
  solve();
  render();
  requestAnimationFrame(frame);
}

/* ---------- 启动 ---------- */
let booted = false;
function boot(){
  if (booted) return;
  booted = true;
  resize();
  requestAnimationFrame(frame);
}

/* ---------- 变阻器滑块事件 ---------- */
const windRange = document.getElementById('windRange');
const windVal   = document.getElementById('windVal');
const pushRange = document.getElementById('pushRange');
const pushVal   = document.getElementById('pushVal');

windRange.addEventListener('input', () => {
  windMul = parseFloat(windRange.value);
  windVal.textContent = windMul.toFixed(2);
});
pushRange.addEventListener('input', () => {
  pushMul = parseFloat(pushRange.value);
  pushVal.textContent = pushMul.toFixed(2);
});

window.addEventListener('resize', resize);

if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(boot);
} else {
  window.addEventListener('load', boot);
}
roofImg.addEventListener('load', resize);
</script>
</body>
